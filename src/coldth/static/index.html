<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11120f">
    <title>Coldth</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link id="theme-stylesheet" rel="stylesheet">
    <script src="/assets/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header class="receiver-header">
        <div id="engine-status" class="status" aria-live="polite">
          <span></span> Connecting
        </div>
      </header>

      <div id="receiver-layout" class="receiver-layout">
        <section class="meters-panel receiver-surface" data-layout-surface="meters" aria-labelledby="meters-title">
          <div class="surface-heading">
            <p class="eyebrow">Output level</p>
            <h2 id="meters-title">Stereo</h2>
          </div>
          <div id="stereo-meter-control" class="stereo-meters"></div>
        </section>

        <section class="balance-panel receiver-surface" data-layout-surface="balance" aria-label="Stereo balance">
          <div id="balance-control" class="balance-control"></div>
        </section>

        <section class="spectrum-panel receiver-surface" data-layout-surface="spectrum" aria-label="Spectrum analyzer">
          <div id="spectrum-control"></div>
        </section>

        <section class="track-info-panel receiver-surface" data-layout-surface="track-info" aria-label="Now playing">
          <div id="track-info-control"></div>
        </section>

        <section class="album-art-panel receiver-surface" data-layout-surface="album-art" aria-label="Album artwork">
          <div id="album-art-control"></div>
        </section>

        <section class="eq-panel receiver-surface" data-layout-surface="tone" aria-labelledby="eq-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Ten-band graphic EQ</p>
              <h2 id="eq-title">Shape the sound</h2>
            </div>
            <button id="reset" class="quiet-button" type="button">Reset</button>
          </div>
          <div id="equalizer" class="equalizer" aria-busy="true"></div>
        </section>

        <section id="preset-component" class="preset-panel receiver-surface" data-layout-surface="presets" aria-labelledby="preset-title"></section>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <footer class="product-signature" aria-label="Coldth Raspberry Pi equalizer">
        <div class="footer-controls">
          <a class="quiet-button settings-link" href="/settings">Settings</a>
          <label class="theme-picker">
            <span>Faceplate</span>
            <select id="theme-list" aria-label="Choose faceplate theme"></select>
          </label>
        </div>
        <div class="signature-lockup">
          <span>Coldth</span>
          <small>Raspberry Pi equalizer</small>
        </div>
      </footer>
    </main>
  </body>
</html>
