<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11120f">
    <title>Coldth</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link id="theme-stylesheet" rel="stylesheet">
    <script src="/assets/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header class="receiver-header">
        <div class="header-controls">
          <a class="quiet-button settings-link" href="/settings">Settings</a>
          <label class="theme-picker">
            <span>Faceplate</span>
            <select id="theme-list" aria-label="Choose faceplate theme"></select>
          </label>
          <div id="engine-status" class="status" aria-live="polite">
            <span></span> Connecting
          </div>
        </div>
      </header>

      <div id="receiver-layout" class="receiver-layout">
        <section class="meters-panel" data-layout-surface="levels" aria-labelledby="meters-title">
          <div class="meter-display">
            <div class="meter-title">
              <p class="eyebrow">Output level</p>
              <h2 id="meters-title">Stereo</h2>
            </div>
            <div class="stereo-meters">
              <div id="stereo-meter-control" class="presentation-contents"></div>
              <div id="balance-control" class="balance-control"></div>
            </div>
            <div id="spectrum-control" class="presentation-contents"></div>
            <div id="metadata-control" hidden></div>
          </div>
        </section>

        <section class="eq-panel" data-layout-surface="tone" aria-labelledby="eq-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Ten-band graphic EQ</p>
              <h2 id="eq-title">Shape the sound</h2>
            </div>
            <button id="reset" class="quiet-button" type="button">Reset</button>
          </div>
          <div id="equalizer" class="equalizer" aria-busy="true"></div>
        </section>

        <section id="preset-component" class="preset-panel" data-layout-surface="presets" aria-labelledby="preset-title"></section>
      </div>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <footer class="product-signature" aria-label="Coldth Raspberry Pi equalizer">
        <span>Coldth</span>
        <small>Raspberry Pi equalizer</small>
      </footer>
    </main>
  </body>
</html>
