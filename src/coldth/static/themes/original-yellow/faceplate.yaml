language: coldth.faceplate
schemaVersion: "0.1"

layouts:
  landscape:
    hidden:
      - spectrum
    root:
      frame: receiver
      direction: column
      gap: 16
      children:
        - frame: now-playing
          direction: row
          gap: 24
          padding: 32
          children:
            - surface: album-art
              width: 64
            - surface: track-info
              width: fill

        - frame: stereo
          direction: column
          gap: 24
          padding: 32
          children:
            - surface: meters
              width: fill
            - surface: balance
              width: fill

        - surface: tone
          width: fill

        - surface: presets
          width: fill

  portrait:
    hidden:
      - spectrum
    root:
      frame: receiver
      direction: column
      gap: 16
      children:
        - frame: now-playing
          direction: column
          gap: 20
          padding: 24
          align: stretch
          children:
            - surface: album-art
              width: 64
            - surface: track-info
              width: fill

        - frame: stereo
          direction: column
          gap: 24
          padding: 24
          children:
            - surface: meters
              width: fill
            - surface: balance
              width: fill

        - surface: tone
          width: fill

        - surface: presets
          width: fill
