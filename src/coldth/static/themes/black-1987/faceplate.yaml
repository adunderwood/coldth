language: coldth.faceplate
schemaVersion: "0.1"

layouts:
  landscape:
    regions:
      - id: preamp
        component: preamp
        presentation: coldth.presentation/rotary-knob@1
        options:
          startAngle: -135
          endAngle: 135
      - id: tone-bank
        component: tone-bank
        presentation: coldth.presentation/fader-ladder@1
        options:
          orientation: vertical
          segments: 24
      - id: spectrum
        component: spectrum
        presentation: coldth.presentation/ten-band-panel@1
        options:
          floor: -60
          segments: 24
      - id: track-info
        component: track-info
        presentation: coldth.presentation/matrix-marquee@1
        options:
          pixelsPerSecond: 42
    root:
      frame: receiver
      direction: column
      gap: 16
      children:
        - frame: now-playing
          direction: row
          gap: 24
          padding: 32
          children:
            - surface: album-art
              width: 64
            - surface: track-info
              width: fill

        - frame: stereo
          direction: column
          gap: 24
          padding: 32
          children:
            - surface: meters
              width: fill
            - surface: balance
              width: fill
            - surface: preamp
              width: fill

        - surface: spectrum
          width: fill

        - surface: tone
          width: fill

        - surface: presets
          width: fill

  portrait:
    regions:
      - id: preamp
        component: preamp
        presentation: coldth.presentation/rotary-knob@1
        options:
          startAngle: -135
          endAngle: 135
      - id: tone
        component: eq
        presentation: coldth.presentation/vertical-fader@1
        options:
          orientation: horizontal
      - id: spectrum
        component: spectrum
        presentation: coldth.presentation/ten-band-panel@1
        options:
          floor: -60
          segments: 24
      - id: track-info
        component: track-info
        presentation: coldth.presentation/matrix-marquee@1
        options:
          pixelsPerSecond: 36
    root:
      frame: receiver
      direction: column
      gap: 16
      children:
        - frame: now-playing
          direction: column
          gap: 20
          padding: 24
          align: stretch
          children:
            - surface: album-art
              width: 64
            - surface: track-info
              width: fill

        - frame: stereo
          direction: column
          gap: 24
          padding: 24
          children:
            - surface: meters
              width: fill
            - surface: balance
              width: fill
            - surface: preamp
              width: fill

        - surface: spectrum
          width: fill

        - surface: tone
          width: fill

        - surface: presets
          width: fill
